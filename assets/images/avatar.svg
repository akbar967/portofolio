<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#050816"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle tech circles -->
  <circle cx="200" cy="200" r="160" stroke="#6C63FF" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.3"/>
  <circle cx="200" cy="200" r="130" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4 8" fill="none" opacity="0.4"/>
  
  <!-- Avatar Silhouette / Icon -->
  <g transform="translate(200, 195)">
    <!-- Head -->
    <circle cx="0" cy="-45" r="50" fill="url(#primaryGrad)" opacity="0.9"/>
    
    <!-- Body/Shoulders -->
    <path d="M-85,90 C-85,25 -45,15 0,15 C45,15 85,25 85,90 Z" fill="url(#primaryGrad)" opacity="0.85"/>
    
    <!-- Stylized Monogram AB on chest -->
    <circle cx="0" cy="-45" r="46" fill="#0d111d" opacity="0.3"/>
    <text x="0" y="-32" font-family="'Inter', sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">AB</text>
  </g>

  <!-- Glowing outer ring -->
  <circle cx="200" cy="200" r="175" stroke="url(#primaryGrad)" stroke-width="3" fill="none" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="175" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6"/>
</svg>
